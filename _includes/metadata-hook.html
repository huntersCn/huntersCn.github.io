<style>
  /* The project has no logo asset; do not leave an empty avatar ring. */
  #sidebar #avatar:not(:has(img)) {
    display: none;
  }

  /* Game UI icons used in report headings. */
  .content h2 img.gi,
  .content h3 img.gi,
  .content h4 img.gi {
    display: inline-block;
    width: 1.08em;
    height: 1.08em;
    margin: 0 0.35em 0 0;
    vertical-align: -0.16em;
    object-fit: contain;
    border: 0 !important;
    border-radius: 0 !important;
    background: transparent !important;
    box-shadow: none !important;
  }

  .content h4 img.gi {
    width: 1em;
    height: 1em;
  }

  /* Heading icons are decorative, not lightbox links. */
  .content h2 a:has(> img.gi),
  .content h3 a:has(> img.gi),
  .content h4 a:has(> img.gi) {
    pointer-events: none;
  }

  /* Signature page */
  .signature-intro {
    margin: 1.25rem 0 1.5rem;
  }

  .signature-lead {
    margin-bottom: 0.7rem;
    line-height: 1.8;
  }

  .signature-badge {
    display: inline-flex;
    align-items: center;
    margin-left: 0.45rem;
    vertical-align: middle;
    white-space: nowrap;
  }

  .signature-badge img {
    width: auto;
    height: 20px;
  }

  .signature-note {
    color: var(--bs-secondary-color);
    font-size: 0.78rem;
  }

  .signature-figure {
    margin: 1.5rem auto 2rem;
    text-align: center;
  }

  .signature-figure > a {
    display: block;
    width: 100%;
    max-width: 560px;
    margin: 0 auto;
  }

  .signature-photo {
    display: block;
    width: 100%;
    max-width: 560px;
    height: auto;
    margin: 0 auto;
    border: 1px solid var(--bs-border-color);
    border-radius: 10px;
    box-shadow: 0 8px 24px rgb(0 0 0 / 12%);
  }

  .signature-groups {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 1rem;
    margin: 1.5rem 0;
  }

  .signature-group {
    padding: 1rem 1.1rem;
    border: 1px solid var(--bs-border-color);
    border-radius: 10px;
    background: var(--bs-tertiary-bg);
  }

  .signature-group h2 {
    margin: 0 0 0.6rem;
    padding: 0;
    border: 0;
    font-size: 1rem;
  }

  .signature-names {
    margin: 0;
    color: var(--bs-body-color);
    font-size: 0.8rem;
    line-height: 1.75;
    word-break: break-word;
  }

  @media (max-width: 768px) {
    .signature-figure > a {
    display: block;
    width: 100%;
    max-width: 560px;
    margin: 0 auto;
  }

  .signature-photo {
      max-width: 100%;
    }

    .signature-groups {
      grid-template-columns: 1fr;
    }
  }

  /* Bottom reading navigation */
  .reading-nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    margin: 3rem 0 1rem;
    padding-top: 1rem;
    border-top: 1px solid var(--bs-border-color);
  }

  .reading-nav a {
    display: flex;
    flex-direction: column;
    gap: 0.12rem;
    min-width: 0;
    text-decoration: none;
  }

  .reading-nav a span {
    color: var(--bs-secondary-color);
    font-size: 0.72rem;
  }

  .reading-nav a strong {
    color: var(--bs-body-color);
    font-size: 0.92rem;
    font-weight: 600;
  }

  .reading-nav a:hover strong {
    color: var(--bs-primary);
  }

  .reading-nav-next {
    align-items: flex-end;
    text-align: right;
  }

  .reading-nav-progress {
    color: var(--bs-secondary-color);
    font-size: 0.72rem;
    white-space: nowrap;
  }

  .reading-nav-empty {
    min-width: 1px;
  }

  @media (max-width: 576px) {
    .reading-nav a strong {
      font-size: 0.82rem;
    }
  }
  /* Sidebar language switch */
  #sidebar .sidebar-bottom > a.lang-toggle {
    display: inline-flex;
    flex: 0 0 auto;
    align-items: center;
    justify-content: center;
    gap: 0.32rem;
    width: auto;
    height: auto;
    min-height: 1.75rem;
    margin-right: 0.35rem;
    padding: 0.18rem 0.6rem;
    border: 1px solid var(--bs-border-color);
    border-radius: 999px;
    background-color: transparent;
    box-shadow: none;
    color: var(--bs-body-color);
    font-size: 0.72rem;
    line-height: 1.5;
    white-space: nowrap;
    text-decoration: none;
  }

  #sidebar .sidebar-bottom > a.lang-toggle span {
    white-space: nowrap;
  }

  #sidebar .sidebar-bottom > a.lang-toggle i {
    line-height: 1;
  }

  #sidebar .sidebar-bottom .lang-toggle:hover {
    border-color: var(--bs-primary);
    color: var(--bs-primary);
  }
  /* Cross-reference markers in the main report. */
  .content sup a.ref {
    display: inline-block;
    margin: 0 0.12em;
    padding: 0 0.18em;
    color: var(--bs-link-color);
    font-size: 0.72em;
    font-weight: 700;
    line-height: 1.5;
    text-decoration: none;
    border-bottom: 1px dotted currentColor;
  }

  .content sup a.ref:hover {
    color: var(--bs-link-hover-color);
    border-bottom-style: solid;
  }

  /* White line-art icons become dark on light backgrounds. */
  img.gi-invert {
    filter: invert(1) brightness(0.25);
  }

  [data-bs-theme="dark"] img.gi-invert {
    filter: none;
  }

  @media (prefers-color-scheme: dark) {
    html:not([data-bs-theme="light"]) img.gi-invert {
      filter: none;
    }
  }
</style>
<script>
  document.addEventListener("DOMContentLoaded", function () {
    function openHash() {
      if (!location.hash) return;
      var el = document.getElementById(decodeURIComponent(location.hash.slice(1)));
      if (el && el.tagName === "DETAILS") el.open = true;
    }
    openHash();
    window.addEventListener("hashchange", openHash);
  });
</script>
